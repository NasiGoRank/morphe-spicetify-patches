name: Preview Desktop Identity and Shuffle Probe

on:
  push:
    branches:
      - experiment/desktop-capability-shuffle-probe
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: desktop-identity-probe-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify source metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          version = "1.2.1-alpha.2"
          assert "version = " + version in Path("gradle.properties").read_text()
          manifest = json.loads(Path("patches-bundle.json").read_text())
          listing = json.loads(Path("patches-list.json").read_text())
          assert manifest["version"] == listing["version"] == version
          assert manifest["download_url"].endswith("/patches-" + version + ".mpp")
          probe = [p for p in listing["patches"] if p["name"] == "Playback identity and Shuffle probe (experimental)"]
          assert len(probe) == 1 and probe[0]["default"] is False
          assert len(listing["patches"]) == 11
          print("Preview metadata verified")
          PY

      - name: Run targeted playback protocol regression tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:extension:testDebugUnitTest --tests app.spicetify.extension.spotify.extensions.PlaybackProbeTest --no-daemon

      - name: Lint, test Morphe patches and build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:extension:lintDebug :patches:test buildAndroid --no-daemon

      - name: Verify built preview artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          file = Path("patches/build/libs/patches-1.2.1-alpha.2.mpp")
          assert file.exists() and file.stat().st_size > 10000, "Missing MPP"
          with zipfile.ZipFile(file) as z:
              assert z.testzip() is None, "Corrupted MPP"
              assert "classes.dex" in z.namelist(), "Missing dex"
              assert z.getinfo("classes.dex").file_size > 0, "Empty dex"
          print("SHA256:", hashlib.sha256(file.read_bytes()).hexdigest())
          PY

      - name: Upload opt-in test artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shuffle-probe-mpp
          path: patches/build/libs/patches-1.2.1-alpha.2.mpp
          if-no-files-found: error

      - name: Publish experimental prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="identity-probe-v1.2.1-alpha.2"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; never silently replace a verified preview."
            exit 1
          fi
          gh release create "$tag" "patches/build/libs/patches-1.2.1-alpha.2.mpp" \
            --target "$GITHUB_SHA" \
            --title "Experimental Android Playback Identity + Shuffle Probe (v1.2.1-alpha.2)" \
            --prerelease \
            --notes "Opt-in Android 9.1.80.2221 ARM64 Morphe probe. Reads Shuffle state and mft/force_shuffle, manually compares SetOptions/SetShufflingContext, and copies a redacted result. No Desktop spoof or Premium unlock. Targeted probe unit tests, extension lint, patch tests and Android bundle build required; full Robolectric suite may be affected by unavailable runner Maven dependencies. Not tested on a physical device. See docs/DESKTOP_IDENTITY_SHUFFLE_PROBE.md."
