name: Preview Audio Ad and Shuffle OFF

on:
  push:
    branches:
      - feature/audio-ad-breaks-shuffle-off
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: audio-shuffle-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout preview metadata
        uses: actions/checkout@v4

      - name: Verify known passing Check run for unchanged application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="45003396414"
          expected_source="e605547aa37b4eb24c9d9c10a1fa57fdb9563e5f"
          result=$(gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json conclusion,headSha \
            --jq '.conclusion + ":" + .headSha')
          if [ "$result" != "success:$expected_source" ]; then
            echo "Refusing: saved Check artifact is not from the expected passing source commit ($result)"
            exit 1
          fi
          echo "CHECK_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Using a passing full CI artifact; git compare confirms only this release workflow changed since."
      - name: Download the tested bundle from Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download "$CHECK_RUN_ID" -R "$GITHUB_REPOSITORY" --name patches --dir dist

      - name: Verify prerelease matches source metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          version = "1.2.1-alpha.1"
          bundle = Path("dist/patches-" + version + ".mpp")
          assert bundle.is_file() and bundle.stat().st_size > 10000, "Missing/empty tested MPP"
          with zipfile.ZipFile(bundle) as z:
              assert z.testzip() is None, "Corrupted archive"
              assert "classes.dex" in z.namelist(), "Android dex missing from bundle"
          descriptor = json.loads(Path("patches-bundle.json").read_text())
          assert descriptor["version"] == version, "Preview descriptor version drift"
          assert descriptor["download_url"].endswith("/patches-" + version + ".mpp")
          patch_list = json.loads(Path("patches-list.json").read_text())
          assert patch_list["version"] == version and len(patch_list["patches"]) == 10
          print("Tested bundle SHA256:", hashlib.sha256(bundle.read_bytes()).hexdigest())
          PY

      - name: Create opt-in experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="adshuffle-preview-v1.2.1-alpha.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Preview assets are immutable; bump version for a different build."
            exit 1
          fi
          gh release create "$tag" "dist/patches-1.2.1-alpha.1.mpp" \
            --target "$GITHUB_SHA" \
            --title "Experimental audio ad breaks and Shuffle OFF (v1.2.1-alpha.1)" \
            --prerelease \
            --notes "Unverified, experimental fork-only Morphe bundle for Spotify 9.1.80.2221 ARM64. Adds two opt-in patches: audio ad slot requests and Shuffle OFF requests. Release reuses the exact MPP artifact from a passing full Check workflow on source commit e605547; all later edits until this release changed workflow configuration only. No Android 16 / Patcher 2.5.0 runtime test has been done. Free accounts may have Shuffle OFF rejected by Spotify. Never treat this as a Premium unlock."
