name: Preview Audio Ad and Shuffle OFF

on:
  push:
    branches:
      - feature/audio-ad-breaks-shuffle-off
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: audio-shuffle-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify experimental patch sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          version = "1.2.1-alpha.1"
          assert "version = " + version in Path("gradle.properties").read_text()
          flags = Path("extensions/extension/src/main/java/app/spicetify/extension/spotify/settings/InstalledPatches.java").read_text()
          assert "disableAudioAdBreaks()" in flags and "forceShuffleOff()" in flags
          manifest = json.loads(Path("patches-bundle.json").read_text())
          assert manifest["version"] == version
          assert manifest["download_url"].endswith("/patches-" + version + ".mpp")
          patches = json.loads(Path("patches-list.json").read_text())
          names = {p["name"] for p in patches["patches"]}
          assert "Disable audio ad breaks (experimental)" in names
          assert "Request Shuffle OFF (experimental)" in names
          print("Preview metadata and both patches verified.")
          PY
      - name: Test and build Android bundle
        env:
          GITHUB_ACTOR: \${{ github.actor }}
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:extension:testDebugUnitTest :extensions:extension:lintDebug :patches:test buildAndroid --no-daemon
      - name: Verify artifact and generated bytecode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          bundle = Path("patches/build/libs/patches-1.2.1-alpha.1.mpp")
          assert bundle.exists() and bundle.stat().st_size > 10000, "Missing Android MPP bundle"
          with ZipFile(bundle) as archive:
              assert archive.testzip() is None, "Corrupted ZIP entry"
              assert "classes.dex" in archive.namelist(), "Missing root Android classes.dex"
              assert archive.getinfo("classes.dex").file_size > 0, "Empty classes.dex"
          print("MPP size:", bundle.stat().st_size)
          print("MPP SHA256:", sha256(bundle.read_bytes()).hexdigest())
          PY
      - name: Verify Android artifact checker guardrails
        run: python3 scripts/test-device-check.py && python3 scripts/test-verify-artifact.py
      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: spicetify-audio-shuffle-preview
          path: patches/build/libs/patches-1.2.1-alpha.1.mpp
          if-no-files-found: error
      - name: Publish opt-in prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          tag="adshuffle-preview-v1.2.1-alpha.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Prerelease already exists. Never replace an already published preview silently."
            exit 0
          fi
          gh release create "$tag" patches/build/libs/patches-1.2.1-alpha.1.mpp \
            --target "$GITHUB_SHA" \
            --title "Experimental audio ad breaks and Shuffle OFF (v1.2.1-alpha.1)" \
            --prerelease \
            --notes "Experimental fork-only Morphe bundle for Spotify 9.1.80.2221 ARM64. Includes two opt-in patches for audio ad slot requests and ContextPlayer shuffle OFF requests. Unit tests and bundle integrity checks pass before release. Not tested on actual Spotify playback, Android 16, or Morphe Patcher 2.5.0. Free-account shuffle restrictions may still be enforced server-side. Source: feature/audio-ad-breaks-shuffle-off."
